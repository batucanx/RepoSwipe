// Compose compiler stability configuration.
//
// Types listed here are treated as @Stable by the Compose compiler, which lets composables that
// receive them skip recomposition when their arguments haven't changed. Wired into every module
// that applies the Compose plugin from the root build.gradle.kts.
//
// ---------------------------------------------------------------------------------------------
// kotlin.collections.List
//
// `List` is only an interface — the compiler can't prove a given instance isn't a MutableList
// being mutated underneath, so it treats every List-holding class as unstable. That single rule
// made `core:data`'s `Repo` unstable (its `topics: List<String>` field), and `Repo` is the type
// the whole swipe deck is built on: RepoCard, SwipeDeck's item list, and every detail-sheet
// section take it, and none of them could skip recomposition because of it. The same applies to
// the feature UI-state classes holding `List<Contributor>` / `List<Repo>`.
//
// THE INVARIANT THIS ASSERTS: no List handed to a composable in this app is mutated after being
// passed. That holds today — every list here is built once by a Retrofit/Room mapper or is a
// top-level `val` (AvailableLanguages, AvailableTopics) — and it must keep holding. If you ever
// need a genuinely mutable collection in UI state, use `mutableStateListOf` (which is observable
// and correctly triggers recomposition) rather than a plain MutableList, otherwise Compose will
// skip and the UI will silently go stale.
kotlin.collections.List
